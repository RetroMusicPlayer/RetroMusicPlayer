name: Build debug APK (feature branches)

on:
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleNormalDebug
      - name: Name the APK after the app
        run: |
          mkdir -p out
          cp app/build/outputs/apk/normal/debug/*.apk "out/R-Music-debug-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: R-Music-debug-apk
          path: out/*.apk
