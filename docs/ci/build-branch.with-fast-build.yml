name: Build APKs (feature branches)

on:
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleNormalDebug
      - name: Name the APK after the app
        run: |
          mkdir -p out
          cp app/build/outputs/apk/normal/debug/*.apk "out/R-Music-debug-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: R-Music-debug-apk
          path: out/*.apk
      - name: Build the fast (optimised) APK
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleNormalFast 2>&1 | tee fast.log || {
            { sed -n '/What went wrong/,/Try:/p' fast.log | head -10; grep -E "^e: |R8: |Missing class" fast.log | head -6; } | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          }
          mkdir -p out-fast
          cp app/build/outputs/apk/normal/fast/*.apk "out-fast/R-Music-fast-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: R-Music-fast-apk
          path: out-fast/*.apk
          if-no-files-found: ignore
